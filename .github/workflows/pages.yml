name: Public site

# Publishes site/ (plain HTML and CSS, no build step) to GitHub Pages, which
# serves it at https://mailgoose.app. It needs no AWS access and no secrets.
#
# One-time setup, in this repository's Settings > Pages: Source "GitHub
# Actions", custom domain mailgoose.app, Enforce HTTPS. The DNS records for the
# apex and www live at GoDaddy; see README.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
